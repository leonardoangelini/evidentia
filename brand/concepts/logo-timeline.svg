<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Evidentia">
  <title>Evidentia — alternative mark: versions on a timeline</title>
  <rect x="0" y="0" width="64" height="64" rx="15" fill="#0f172a"/>
  <!-- Page -->
  <rect x="14" y="11" width="36" height="42" rx="5" fill="none" stroke="#60a5fa" stroke-width="3"/>
  <!-- Word count over versions -->
  <polyline points="21,42 29,36 37,30 45,20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="21" cy="42" r="3.2" fill="#ffffff"/>
  <circle cx="29" cy="36" r="3.2" fill="#ffffff"/>
  <circle cx="37" cy="30" r="3.2" fill="#ffffff"/>
  <circle cx="45" cy="20" r="3.2" fill="#93c5fd"/>
</svg>
