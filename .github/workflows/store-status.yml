# Interroga il Chrome Web Store sullo stato dell'item: versione pubblicata,
# eventuale submission in review, visibilità. Sola lettura, non pubblica nulla.
#
# Si sceglie l'ambiente da interrogare: `chrome-web-store-testing` (item
# "Evidentia (Testing)") o `chrome-web-store` (estensione pubblica). Le
# credenziali vivono negli environment, quindi interrogare la produzione
# chiede la stessa approvazione del rilascio: è il prezzo di tenere i secret
# fuori dalla portata di qualunque altro workflow.
name: Store status

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Quale item interrogare'
        type: choice
        default: chrome-web-store-testing
        options:
          - chrome-web-store-testing
          - chrome-web-store

permissions:
  contents: read

jobs:
  status:
    name: Stato di ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - name: Interroga lo store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          PRIVATE_KEY_B64: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY_B64 }}
        run: |
          set -e
          export CHROME_SERVICE_ACCOUNT_PRIVATE_KEY="$(echo "$PRIVATE_KEY_B64" | base64 -d)"
          npx publish-extension status --chrome-api-version v2
