# Verifica su ogni push e pull request: typecheck, test, build dello ZIP.
# La pubblicazione sul Chrome Web Store è in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      # `postinstall` esegue `wxt prepare`, che genera i tipi in .wxt/.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  build:
    name: Build dello ZIP
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      # Nessun .env in CI: la build non contiene la chiave che fissa l'id
      # dell'estensione, così lo store assegna il proprio. Vedi wxt.config.ts.
      - run: npm run zip

      - uses: actions/upload-artifact@v4
        with:
          name: evidentia-chrome-${{ github.sha }}
          path: .output/*-chrome.zip
          retention-days: 30
          if-no-files-found: error
          # .output/ inizia con un punto: senza questo, upload-artifact la
          # tratta come nascosta, non trova nulla e il job fallisce.
          include-hidden-files: true
