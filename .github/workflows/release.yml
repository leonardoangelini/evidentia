# Ambiente di produzione: l'estensione pubblica sul Chrome Web Store.
#
# Rilasciare è `npm version patch && git push`. Questo workflow parte quando
# `package.json` cambia su main e pubblica se quella version non è ancora
# stata rilasciata, cioè se il tag `vX.Y.Z` non esiste ancora. A
# pubblicazione avvenuta crea tag e Release con le note.
#
# Perché la pubblicazione sta qui e non su `release: published`: una Release
# creata con il GITHUB_TOKEN non fa partire altri workflow — GitHub lo
# impedisce per evitare ricorsioni — quindi il tag arriva dopo la
# pubblicazione, non prima. Che è anche più onesto: esiste un tag solo per
# ciò che è stato davvero inviato allo store.
#
# Pubblicare significa **inviare a revisione**: è Google a decidere quando
# l'aggiornamento raggiunge chi ha l'estensione installata.
#
# Secret e variabili richiesti: vedi docs/release.md.
name: Release

on:
  push:
    branches: [main]
    # Solo un cambio di package.json può essere un rilascio. Il controllo sul
    # tag qui sotto distingue il bump di version da un cambio di dipendenze.
    paths: ['package.json']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verifica credenziali e ZIP senza caricare nulla'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: C'è una version nuova da rilasciare?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Serve la storia completa: i tag sono il registro di ciò che è
          # già stato pubblicato.
          fetch-depth: 0

      - id: check
        env:
          DISPATCH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Una prova a vuoto non rilascia niente: gira anche su una version
          # già pubblicata, serve proprio a provare la procedura.
          if [ "$DISPATCH_DRY_RUN" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Prova a vuoto su v$VERSION: nessun caricamento."
            exit 0
          fi

          # Si rilascia solo se la version è cambiata *in questo push*. Senza
          # questo, aggiungere una dipendenza pubblicherebbe una version
          # alzata giorni prima e mai rilasciata.
          BEFORE="${{ github.event.before }}"
          PREV=""
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE:package.json" 2>/dev/null; then
            git show "$BEFORE:package.json" > /tmp/prev-package.json
            PREV=$(node -p "require('/tmp/prev-package.json').version")
          fi

          if [ -n "$PREV" ] && [ "$PREV" = "$VERSION" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json è cambiato ma la version è sempre $VERSION: nessuna pubblicazione."
            exit 0
          fi

          # Seconda rete: un tag esistente dice che quella version è già
          # stata inviata allo store, che la rifiuterebbe come duplicata.
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION risulta già rilasciata (il tag esiste). Nessuna pubblicazione."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::version $PREV → $VERSION, mai rilasciata: si pubblica sullo store."
          fi

  production:
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      environment: chrome-web-store
      channel: production
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

  release:
    name: Tag e Release
    needs: [check, production]
    # Una prova a vuoto non ha pubblicato nulla: non lascia un tag a dire il
    # contrario.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Crea v<version> con le note
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Evidentia v$VERSION" \
            --generate-notes
