# Pubblicazione sul Chrome Web Store: l'unico ambiente di rilascio.
#
# Rilasciare è `npm version patch && git push`. Questo workflow parte quando
# `package.json` cambia su main e pubblica se quella version non è ancora
# stata rilasciata, cioè se il tag `vX.Y.Z` non esiste ancora. A
# pubblicazione avvenuta crea tag e Release con le note.
#
# Perché la pubblicazione sta qui e non su `release: published`: una Release
# creata con il GITHUB_TOKEN non fa partire altri workflow — GitHub lo
# impedisce per evitare ricorsioni — quindi il tag arriva dopo la
# pubblicazione, non prima. Che è anche più onesto: esiste un tag solo per
# ciò che è stato davvero inviato allo store.
#
# Pubblicare significa **inviare a revisione**: è Google a decidere quando
# l'aggiornamento raggiunge chi ha l'estensione installata.
#
# Secret e variabili richiesti: vedi docs/release.md.
name: Release

on:
  push:
    branches: [main]
    # Solo un cambio di package.json può essere un rilascio. Il controllo sul
    # tag qui sotto distingue il bump di version da un cambio di dipendenze.
    paths: ['package.json']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verifica credenziali e ZIP senza caricare nulla'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: C'è una version nuova da rilasciare?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Serve la storia completa: i tag sono il registro di ciò che è
          # già stato pubblicato.
          fetch-depth: 0

      - id: check
        env:
          DISPATCH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Una prova a vuoto non rilascia niente: gira anche su una version
          # già pubblicata, serve proprio a provare la procedura.
          if [ "$DISPATCH_DRY_RUN" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Prova a vuoto su v$VERSION: nessun caricamento."
            exit 0
          fi

          # Si rilascia solo se la version è cambiata *in questo push*. Senza
          # questo, aggiungere una dipendenza pubblicherebbe una version
          # alzata giorni prima e mai rilasciata.
          BEFORE="${{ github.event.before }}"
          PREV=""
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE:package.json" 2>/dev/null; then
            git show "$BEFORE:package.json" > /tmp/prev-package.json
            PREV=$(node -p "require('/tmp/prev-package.json').version")
          fi

          if [ -n "$PREV" ] && [ "$PREV" = "$VERSION" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json è cambiato ma la version è sempre $VERSION: nessuna pubblicazione."
            exit 0
          fi

          # Seconda rete: un tag esistente dice che quella version è già
          # stata inviata allo store, che la rifiuterebbe come duplicata.
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION risulta già rilasciata (il tag esiste). Nessuna pubblicazione."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::version $PREV → $VERSION, mai rilasciata: si pubblica sullo store."
          fi

  publish:
    name: Pubblica sullo store
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      # Un rilascio verifica sempre, anche quando la CI ha già girato sullo
      # stesso commit: il job di pubblicazione deve bastare a sé stesso.
      - run: npm run typecheck

      - run: npm test

      # Nessun .env in CI: lo ZIP non contiene la chiave che fissa l'id
      # dell'estensione, così l'item usa l'id assegnato dallo store.
      # WXT_GOOGLE_CLIENT_ID non è un segreto (finisce nel bundle: è un
      # public client OAuth, senza client secret) ed è quindi una variabile,
      # non un secret. Se assente, ogni scuola inserisce il proprio client ID
      # nelle impostazioni di Evidentia.
      - name: Build dello ZIP
        env:
          EVIDENTIA_CHANNEL: production
          WXT_GOOGLE_CLIENT_ID: ${{ vars.WXT_GOOGLE_CLIENT_ID }}
        run: npm run zip

      # Un fork non ha le credenziali dello store: in quel caso il workflow
      # costruisce e verifica, poi salta la pubblicazione con un avviso,
      # invece di fallire in rosso.
      - name: Credenziali disponibili?
        id: preflight
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PRIVATE_KEY_B64: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$CHROME_EXTENSION_ID" ] && [ -n "$PRIVATE_KEY_B64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Environment 'chrome-web-store' senza credenziali del Chrome Web Store: pubblicazione saltata, lo ZIP resta fra gli artefatti. Vedi docs/release.md."
          fi

      - name: Riepilogo del pacchetto
        run: |
          set -euo pipefail
          MANIFEST=.output/chrome-mv3/manifest.json
          {
            echo "| campo | valore |"
            echo "|---|---|"
            echo "| name | $(node -p "require('./$MANIFEST').name") |"
            echo "| version | $(node -p "require('./$MANIFEST').version") |"
            echo "| client ID OAuth nella build | $([ -n "${{ vars.WXT_GOOGLE_CLIENT_ID }}" ] && echo 'presente' || echo 'assente — la scuola usa il proprio') |"
            echo "| dry run | ${{ inputs.dry_run || false }} |"
            echo "| pubblicazione | $([ '${{ steps.preflight.outputs.configured }}' = 'true' ] && echo 'sì' || echo 'saltata: environment senza credenziali') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pubblica
        if: steps.preflight.outputs.configured == 'true'
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          # La chiave del service account è conservata in base64: un secret di
          # GitHub accetta gli a-capo del PEM, ma il base64 evita ogni
          # ambiguità di quoting nello shell.
          PRIVATE_KEY_B64: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY_B64 }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          export CHROME_SERVICE_ACCOUNT_PRIVATE_KEY="$(echo "$PRIVATE_KEY_B64" | base64 -d)"
          ZIP=$(ls .output/*-chrome.zip | head -n 1)
          test -f "$ZIP" || { echo "ZIP non trovato in .output/"; exit 1; }
          echo "ZIP: $ZIP"
          ARGS=(--chrome-api-version v2 --chrome-zip "$ZIP")
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          npx publish-extension "${ARGS[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: evidentia-${{ github.sha }}
          path: .output/*-chrome.zip
          retention-days: 30
          if-no-files-found: error
          # .output/ inizia con un punto: senza questo, upload-artifact la
          # tratta come nascosta, non trova nulla e il job fallisce.
          include-hidden-files: true

  release:
    name: Tag e Release
    needs: [check, publish]
    # Una prova a vuoto non ha pubblicato nulla: non lascia un tag a dire il
    # contrario.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Crea v<version> con le note
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Evidentia v$VERSION" \
            --generate-notes
