# Ambiente di produzione: l'estensione pubblica sul Chrome Web Store.
#
# Si rilascia pubblicando una **Release** di GitHub sul tag `vX.Y.Z`:
#
#     npm version patch && git push --follow-tags
#     gh release create v0.1.1 --generate-notes
#
# Non su push di un tag, di proposito. Un evento `push: tags` esegue il
# workflow presente *nel commit taggato*, quindi taggare un commit vecchio
# fa girare la versione vecchia di questo file; un evento `release` prende
# il workflow dal branch di default, sempre. In più un tag si crea per
# sbaglio con niente (`npm version`, `git push --tags`), una release no.
#
# Se all'environment `chrome-web-store` sono configurati dei reviewer, il job
# resta in attesa di approvazione: ogni submission entra nella review di
# Google, quindi il click è voluto.
#
# Secret e variabili richiesti: vedi docs/release.md.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verifica credenziali e ZIP senza caricare nulla'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Il tag coincide con package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Lo store rifiuta un upload con una version già pubblicata, e lo dice
      # a metà workflow. Qui il disallineamento fra il tag della release e la
      # version del pacchetto si vede subito, prima di costruire alcunché.
      - name: Confronta tag e version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$TAG" ]; then
            echo "Esecuzione manuale, nessuna release da confrontare: package.json dice $VERSION."
            exit 0
          fi
          echo "release: $TAG — package.json: $VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::La release è sul tag $TAG ma package.json dice $VERSION: la version non è stata alzata, o il tag è sbagliato."
            exit 1
          fi

  production:
    needs: guard
    uses: ./.github/workflows/publish.yml
    with:
      environment: chrome-web-store
      channel: production
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
