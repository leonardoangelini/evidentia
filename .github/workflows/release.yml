# Ambiente di produzione: l'estensione pubblica sul Chrome Web Store.
#
# Si rilascia promuovendo main su `production` (merge o fast-forward). Se
# all'environment `chrome-web-store` sono configurati dei reviewer, il job
# resta in attesa di approvazione: ogni submission entra nella review di
# Google, quindi il click è voluto.
#
# La version di package.json deve essere stata alzata: lo store rifiuta un
# upload con una version già pubblicata, e il controllo qui sotto lo dice
# subito invece di far fallire l'upload a metà workflow.
#
# Secret e variabili richiesti: vedi docs/release.md.
name: Release

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verifica credenziali e ZIP senza caricare nulla'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: La version è nuova
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Il tag v<version> non esiste già
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "package.json: $VERSION"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Il tag v$VERSION esiste già: la version di package.json non è stata alzata prima della promozione."
            exit 1
          fi

  production:
    needs: guard
    uses: ./.github/workflows/publish.yml
    with:
      environment: chrome-web-store
      channel: production
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

  tag:
    name: Tag della release
    needs: production
    # Un dry run non ha pubblicato nulla: non lascia un tag a dire il contrario.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Crea v<version>
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Evidentia v$VERSION"
          git push origin "v$VERSION"
