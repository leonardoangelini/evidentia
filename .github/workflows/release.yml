# Pubblicazione sul Chrome Web Store.
#
# Parte su un tag `vX.Y.Z` (o a mano da Actions → Run workflow) e si ferma
# in attesa di approvazione se all'environment `chrome-web-store` sono
# configurati dei reviewer: l'equivalente del job manuale di GitLab CI.
# Ogni submission entra nella review di Google, quindi il click è voluto.
#
# Secret e variabili richiesti: vedi docs/release.md.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verifica credenziali e ZIP senza caricare nulla'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Chrome Web Store
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Il tag deve corrispondere alla version in package.json: il Chrome Web
      # Store rifiuta un upload con una version già pubblicata.
      - name: Il tag corrisponde a package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME diverso da package.json ($PKG_VERSION)."
            exit 1
          fi

      # Nessun .env in CI: lo ZIP non contiene la chiave che fissa l'id
      # dell'estensione. WXT_GOOGLE_CLIENT_ID non è un segreto (finisce nel
      # bundle) ed è quindi una variabile, non un secret; se assente, ogni
      # docente inserisce il proprio client ID nelle impostazioni.
      - name: Build dello ZIP
        env:
          WXT_GOOGLE_CLIENT_ID: ${{ vars.WXT_GOOGLE_CLIENT_ID }}
        run: npm run zip

      - name: Pubblica
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          # La chiave del service account è conservata in base64: un secret di
          # GitHub accetta gli a-capo del PEM, ma il base64 evita ogni
          # ambiguità di quoting nello shell.
          PRIVATE_KEY_B64: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY_B64 }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -e
          export CHROME_SERVICE_ACCOUNT_PRIVATE_KEY="$(echo "$PRIVATE_KEY_B64" | base64 -d)"
          ZIP=$(ls .output/*-chrome.zip | head -n 1)
          test -f "$ZIP" || { echo "ZIP non trovato in .output/"; exit 1; }
          echo "ZIP: $ZIP"
          if [ "$DRY_RUN" = "true" ]; then
            npx publish-extension --chrome-api-version v2 --chrome-zip "$ZIP" --dry-run
          else
            npx publish-extension --chrome-api-version v2 --chrome-zip "$ZIP"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: evidentia-${{ github.ref_name }}
          path: .output/*-chrome.zip
          if-no-files-found: error
          # .output/ inizia con un punto: senza questo, upload-artifact la
          # tratta come nascosta, non trova nulla e il job fallisce.
          include-hidden-files: true
